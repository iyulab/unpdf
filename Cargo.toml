[workspace]
members = [".", "cli", "unpdf-wasm"]
# MSRV-aware: a dependency whose newer release needs a newer rustc than `rust-version`
# resolves to the newest one that does not.
resolver = "3"

[package]
name = "unpdf"
version = "0.52.2"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "High-performance PDF content extraction to Markdown, text, and JSON"
repository = "https://github.com/iyulab/unpdf"
homepage = "https://github.com/iyulab/unpdf"
documentation = "https://docs.rs/unpdf"
readme = "README.md"
keywords = ["pdf", "markdown", "text-extraction", "document", "parser"]
categories = ["parser-implementations", "text-processing"]
rust-version = "1.89"

[lib]
name = "unpdf"
crate-type = ["lib", "cdylib"]

[features]
default = ["fast-parse", "refine", "ai"]
ffi = ["raster", "standard-fonts"]  # the C ABI includes page rasterization (`unpdf_render_page`), stand-in faces included
async = ["tokio"]
fast-parse = []  # Enable nom_parser for faster PDF parsing
# Shape-refinement pass (RenderOptions.refine). Enables unparser-shared's
# `refine` module, and with it pulldown-cmark + pulldown-cmark-to-cmark (unpdf has no other use for a
# CommonMark parser). On by default for native/CLI/FFI builds; unpdf-wasm
# excludes it (see its Cargo.toml) to keep the wasm bundle delta negligible.
refine = ["unparser-shared/refine"]
# VLM image understanding + AI refine (ParseOptions.ai / RenderOptions.ai_refine).
# Native-only — unparser-shared's `ai` feature depends on `ureq`, which does not
# support wasm32-unknown-unknown. unpdf-wasm never enables this feature.
ai = ["unparser-shared/ai"]
# Page rasterization (`PdfParser::render_page`): paints a page from the same content
# interpretation text extraction reads, so the page rendered is the page extracted. Off by
# default; pure Rust (tiny-skia rasterizer, zune-jpeg for DCT images), wasm untouched.
raster = ["dep:tiny-skia", "dep:zune-jpeg", "dep:skrifa", "dep:hayro-jpeg2000"]
# Stand-in faces for fonts a PDF names but does not embed (the standard 14, Arial, Times New
# Roman, ...): PDFium's 14 standard faces (bare CFF), BSD-3-Clause, about 265 KB in the binary.
standard-fonts = ["raster"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Shared plumbing for the un* family: error-kind numbering and C-ABI helpers at
# the crate root (dependency-free), plus the shape-refinement pass and the VLM/AI
# capabilities behind the `refine` and `ai` features above.
unparser-shared = { version = "0.12", default-features = false }

# Compression
flate2 = "1.1"
crc32fast = "1.5"  # PNG chunk CRCs when re-encoding FlateDecode images

# PDF decryption
rc4 = "0.2"
md-5 = "0.11"
# The password hashes of AES-256 encryption (revisions 5 and 6).
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"

# CCITT Group 3/4 fax images (`CCITTFaxDecode`), decoded for rendering and for re-encoding
# as PNG. 0.4 needs rustc 1.92, past the declared MSRV; it moves with the MSRV.
hayro-ccitt = "0.3"
# JBIG2 images (`JBIG2Decode`), likewise; the same family and the same MSRV note.
hayro-jbig2 = { version = "0.3", default-features = false, features = ["std"] }

# Text processing
regex = "1.11"
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
unicode-normalization = "0.1"
# Metadata and outline strings written in a legacy CJK code page without a byte-order
# mark (CP949, Shift_JIS, GBK, Big5) — detection and decoding.
chardetng = "1.0"
encoding_rs = "0.8"

# Date/time
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# Logging
log = "0.4"

# Optional: Async I/O
tokio = { version = "1.42", features = ["rt", "fs"], optional = true }

# Rasterizer and JPEG decoder for the `raster` feature.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"], optional = true }
zune-jpeg = { version = "0.5", optional = true }
# TrueType/OpenType outlines, and bare CFF programs through its `raw` (read-fonts) reader.
skrifa = { version = "0.48", optional = true }
# JPEG 2000 images (`JPXDecode`) for the `raster` feature; the resource inventory hands them on
# as `image/jp2` undecoded. 0.4 needs rustc 1.92, past the declared MSRV; it moves with the MSRV.
hayro-jpeg2000 = { version = "0.3", default-features = false, features = ["std", "simd"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
crossbeam-channel = "0.5"

[dev-dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.14"
peak_alloc = "0.3"
serde_json = "1.0"  # FFI introspection 테스트의 JSON 결과 검증용
png = "0.18"  # round-trip verification for the FlateDecode-image PNG re-encoder
tiny_http = "0.12"  # minimal mock HTTP server for the "ai" feature's integration tests

[[bench]]
name = "parse_benchmark"
harness = false

[[test]]
name = "ai_wiring_test"
path = "tests/ai_wiring_test.rs"
required-features = ["ai"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
