[package]
name = "unpdf-wasm"
version = "0.15.0"
edition = "2021"
description = "High-performance PDF extraction to Markdown, text, and JSON (WebAssembly)"
repository = "https://github.com/iyulab/unpdf"
license = "MIT"
keywords = ["pdf", "markdown", "wasm", "webassembly", "text-extraction"]
categories = ["wasm", "parser-implementations"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Excludes "refine": pulls in a fresh pulldown-cmark/pulldown-cmark-to-cmark
# that unpdf otherwise has no use for. Measured delta with the exclusion:
# +54 bytes (essentially zero) -- see undoc-wasm's equivalent exclusion for
# the pre-gating number (+21.5%, same root cause).
unpdf = { version = "0.15.0", path = "..", default-features = false, features = ["fast-parse"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
