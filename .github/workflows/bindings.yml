name: Build and Publish Bindings

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to package registries'
        required: false
        default: 'false'

jobs:
  bindings:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: iyulab/uncore/.github/workflows/bindings-reusable.yml@main
    with:
      package-name: unpdf
      csharp-project-name: Unpdf
      nuget-staging-mode: flat
      nuget-test-matrix: |
        [
          {"os":"ubuntu-latest","artifact":"native-linux-x64","runtime":"linux-x64"},
          {"os":"windows-latest","artifact":"native-win-x64","runtime":"win-x64"},
          {"os":"macos-latest","artifact":"native-osx-arm64","runtime":"osx-arm64"}
        ]
      validate-packed-nuget: false
      publish: ${{ github.event.workflow_run.conclusion == 'success' || github.event.inputs.publish == 'true' }}
    permissions:
      contents: read
    secrets: inherit
