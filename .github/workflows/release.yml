name: Release

# The pipeline itself is unparser-shared's release-reusable.yml, shared by the parser
# crates; this file keeps the trigger and says what differs here. The workflow name is
# load-bearing: bindings.yml starts when "Release" completes.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave empty to use Cargo.toml version)'
        required: false
        type: string

jobs:
  release:
    uses: iyulab/unparser-shared/.github/workflows/release-reusable.yml@main
    with:
      package-name: unpdf
      version: ${{ inputs.version }}
      cli-musl: true
      ffi-archives: true
      npm-readme: bindings/wasm/README.md
      csharp-project-name: Unpdf
      nuget-staging-mode: flat
      nuget-test-matrix: |
        [
          {"os":"ubuntu-latest","artifact":"native-linux-x64","runtime":"linux-x64"},
          {"os":"windows-latest","artifact":"native-win-x64","runtime":"win-x64"},
          {"os":"macos-latest","artifact":"native-osx-arm64","runtime":"osx-arm64"}
        ]
      validate-packed-nuget: true
    # A called workflow can narrow the token's permissions, never widen them: this is the
    # most any of its jobs needs (creating the release and pruning old ones).
    permissions:
      contents: write
    secrets: inherit
