[package]
name = "unpdf-cli"
version = "0.54.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "CLI tool for extracting PDF content to Markdown, text, and JSON"
repository = "https://github.com/iyulab/unpdf"
readme = "../README.md"
keywords = ["pdf", "markdown", "cli", "text-extraction"]
categories = ["command-line-utilities"]
rust-version = "1.89"

[[bin]]
name = "unpdf"
path = "src/main.rs"

[dependencies]
unpdf = { version = "0.54.0", path = ".." }
serde_json = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Terminal colors
colored = "3.1"

# Progress bars
indicatif = "0.18"

# Logging
env_logger = "0.11"
log = "0.4"

# The update notice and the `update` command, shared by the family's CLIs.
unparser-shared = { version = "0.12", default-features = false, features = ["cli-update"] }

[dev-dependencies]
tempfile = "3"
