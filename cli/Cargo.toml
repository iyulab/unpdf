[package]
name = "unpdf-cli"
version = "0.20.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "CLI tool for extracting PDF content to Markdown, text, and JSON"
repository = "https://github.com/iyulab/unpdf"
readme = "../README.md"
keywords = ["pdf", "markdown", "cli", "text-extraction"]
categories = ["command-line-utilities"]
rust-version = "1.89"

[[bin]]
name = "unpdf"
path = "src/main.rs"

[dependencies]
unpdf = { version = "0.20.0", path = ".." }
serde_json = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Terminal colors
colored = "3.1"

# Progress bars
indicatif = "0.18"

# Self-update from GitHub releases
self_update = { version = "1.3", features = ["archive-zip", "archive-tar", "compression-tar-gz", "compression-zip-deflate"] }

# Staging directory and in-place binary replacement for the update flow. self_update stopped
# re-exporting these in 1.0; its own docs direct callers to depend on them directly.
tempfile = "3"
self-replace = "1.5"

# Async runtime (for update)
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }

# Semantic versioning
semver = "1.0"

# Logging
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3"
